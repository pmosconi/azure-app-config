[project]
name = "actvalue.azure-app-config"
version = "0.3.0"
description = "Hydrate os.environ from Azure App Configuration, with the failure handling that platform actually needs"
authors = [{name = "ActValue"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["azure", "app-configuration", "configuration", "key-vault", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "azure-appconfiguration-provider>=2.5.0,<3",
    "azure-identity>=1.25.3,<2",
]

[project.urls]
Homepage = "https://github.com/pmosconi/azure-app-config"
Repository = "https://github.com/pmosconi/azure-app-config"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_app_config"]

[tool.hatch.build.targets.sdist]
include = ["src/azure_app_config", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=azure_app_config --cov-report=term-missing"
markers = [
    "unit: Unit tests (no external dependencies; the provider's load() is faked)",
    "integration: Drives the real provider against an RFC 2606 .invalid endpoint (no Azure, no egress)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "mypy>=1.19.1",
    "twine>=7.0.0",
]
